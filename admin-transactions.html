<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed transactions — Admin | TCP Immigration</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/payment.css">
    <script>
      /* Same Supabase loader as admin.html / pay.html: jsdelivr -> unpkg fallback,
         exposes window.__supabaseReady so admin-transactions.js can wait for the
         CDN library before creating the service-role client. */
      (function () {
        window.__supabaseReady = new Promise(function (resolve, reject) {
          var sources = [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://unpkg.com/@supabase/supabase-js@2'
          ];
          var i = 0;
          function tryNext() {
            if (i >= sources.length) { reject(new Error('All Supabase CDNs failed to load.')); return; }
            var src = sources[i++];
            var s = document.createElement('script');
            s.src = src; s.async = true;
            s.onload = function () {
              if (window.supabase && window.supabase.createClient) resolve(window.supabase);
              else reject(new Error('Supabase script loaded but createClient is missing.'));
            };
            s.onerror = function () { tryNext(); };
            document.head.appendChild(s);
          }
          tryNext();
        });
      })();
    </script>
    <style>
      /* Page-specific tweaks for the transactions list. */
      .txn-tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
      .txn-tab {
        background: #fff; border: 1px solid var(--border, #e5e5e5);
        border-radius: 999px; padding: .55rem 1.1rem; cursor: pointer;
        font-weight: 600; color: var(--text-light); font-size: .9rem;
        display: inline-flex; align-items: center; gap: .5rem;
        transition: .15s;
      }
      .txn-tab:hover { border-color: var(--primary); color: var(--primary); }
      .txn-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
      .txn-tab .count {
        background: rgba(255,255,255,.25); color: inherit;
        border-radius: 999px; font-size: .75rem; padding: .1rem .55rem;
      }
      .txn-tab:not(.active) .count { background: #eef0f4; color: var(--text-light); }

      .txn-list { display: grid; gap: 1rem; }
      .txn-card {
        background: #fff; border-radius: 1rem;
        box-shadow: var(--shadow-card, 0 4px 20px rgba(0,0,0,.08));
        padding: 1.25rem 1.4rem; border: 1px solid #eef0f4;
        display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: start;
      }
      .txn-head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .35rem; }
      .txn-name { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
      .txn-meta { color: var(--text-light); font-size: .85rem; margin-bottom: .5rem; line-height: 1.5; }
      .txn-amount {
        background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
        border: 1px solid #e8ecf1; border-radius: .7rem;
        padding: .55rem .85rem; display: inline-flex; gap: .55rem; align-items: baseline;
        font-size: .92rem; margin: .25rem 0 .5rem;
      }
      .txn-amount strong { color: var(--primary); }
      .txn-link {
        font-size: .85rem; color: var(--text-light);
      }
      .txn-link a { color: var(--secondary); text-decoration: none; font-weight: 600; }
      .txn-actions { display: flex; flex-direction: column; gap: .5rem; align-items: flex-end; }
      .txn-actions .small { font-size: .82rem; color: var(--text-light); }
      .badge.completed { background: #e8f5e9; color: #2e7d32; }
      .badge.awaiting  { background: #e3f2fd; color: #1565c0; }

      @media (max-width: 600px) {
        .txn-card { grid-template-columns: 1fr; }
        .txn-actions { flex-direction: row; flex-wrap: wrap; align-items: center; }
      }
    </style>
</head>
<body>

                <span class="divider">|</span>
                <a href="admin.html">← Payment links</a>
            </div>
        </div>
    </header>

    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="index.html"><img src="logo.png" alt="TCP" class="logo"></a></div>
            <div id="auth-area"></div>
        </div>
    </nav>

    <section style="background:#f9f9f9; padding: 2.5rem 0; min-height: 70vh;">
        <div class="admin-shell">
            <div id="auth-screen"></div>
            <div id="dashboard" class="hidden"></div>
        </div>
    </section>

    <footer style="background: #E3F2FD; padding: 4rem 0 2rem 0;">
        <div class="container">
            <div style="border-top: 1px solid #d0d0d0; padding-top: 2rem;">
                <p style="color: #666; margin: 0;">© Copyright 2026 TCP Immigration Services. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/admin-transactions.js"></script>
</body>
