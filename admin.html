    <link rel="stylesheet" href="css/payment.css">
    <script>
      /* Supabase loader with jsdelivr -> unpkg fallback.
         Exposes window.__supabaseReady (a Promise) so admin.js / pay.js can
         wait for the library to finish loading before they run. The promise
         resolves once Supabase is available on window.supabase, and rejects
         only if every CDN fails (ad-blocker / firewall / outage). */
      (function () {
        window.__supabaseReady = new Promise(function (resolve, reject) {
          var sources = [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://unpkg.com/@supabase/supabase-js@2'
          ];
          var i = 0;
          function tryNext() {
            if (i >= sources.length) {
              reject(new Error('All Supabase CDNs failed to load.'));
              return;
            }
            var src = sources[i++];
            var s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.onload = function () {
              if (window.supabase && window.supabase.createClient) resolve(window.supabase);
              else reject(new Error('Supabase script loaded but createClient is missing.'));
            };
            s.onerror = function () { tryNext(); };
            document.head.appendChild(s);
          }
          tryNext();
        });
      })();
    </script>
</head>
